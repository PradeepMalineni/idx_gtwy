openapi: 3.0.0
info:
  title: Pet Store API
  description: A sample API for a pet store (non-PCI example)
  version: 1.0.0
  contact:
    email: api@petstore.com

servers:
  - url: https://api.petstore.com/v1
    description: Production server

paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Bad request
    
    post:
      summary: Create a pet
      operationId: createPet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input

  /pets/{petId}:
    get:
      summary: Get a pet by ID
      operationId: getPet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The ID of the pet to retrieve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the pet
        name:
          type: string
          description: Name of the pet
        species:
          type: string
          description: Species of the pet (dog, cat, etc.)
        age:
          type: integer
          description: Age of the pet in years
        owner:
          type: string
          description: Name of the pet owner

    NewPet:
      type: object
      required:
        - name
        - species
      properties:
        name:
          type: string
          description: Name of the pet
        species:
          type: string
          description: Species of the pet
        age:
          type: integer
          description: Age of the pet in years
        owner:
          type: string
          description: Name of the pet owner

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.petstore.com/oauth/authorize
          tokenUrl: https://auth.petstore.com/oauth/token
          scopes:
            read:pets: Read pet information
            write:pets: Create and update pets

security:
  - OAuth2: [read:pets]

